name: Release Flash Binary

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create a GitHub Release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc patchelf

    - name: Install Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install nuitka

    - name: Compile with Nuitka
      run: |
        python -m nuitka \
          --standalone \
          --onefile \
          --output-filename=flash-linux-amd64 \
          flash

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: flash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
